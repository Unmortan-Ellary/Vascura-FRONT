        /* =============================================
           UTILITY FUNCTIONS
           ============================================= */

        /**
         * Count words in a text string.
         */
        function countWords(text) {
            if (!text) return 0;
            const stripped = text
                .replace(/#{1,6}\s/g, '')
                .replace(/\*\*|__/g, '')
                .replace(/\*|_/g, '')
                .replace(/`{1,3}[^`]*`{1,3}/g, '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/<[^>]+>/g, '')
                .trim();
            return stripped.split(/\s+/).filter(w => w.length > 0).length;
        }

        /**
         * Rough token estimation (~4 chars per token for English).
         */
        function estimateTokens(text) {
            if (!text) return 0;
            return Math.ceil(text.length / 4);
        }

        /**
         * Escape HTML special characters for safe insertion.
         */
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Escape text for use in HTML attributes.
         */
        function escapeAttr(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '&#10;');
        }

        /**
         * Copy text to clipboard with visual feedback.
         */
        function copyToClipboard(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                if (buttonElement) {
                    const originalHtml = buttonElement.innerHTML;
                    buttonElement.classList.add('copied');
                    buttonElement.innerHTML = '<span class="ic ic-w3">' + svg('check') + '</span> Copied';
                    setTimeout(() => {
                        buttonElement.classList.remove('copied');
                        buttonElement.innerHTML = originalHtml;
                    }, 1500);
                }
                showToast('Copied to clipboard', 'info');
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Copied to clipboard', 'info');
                } catch (e) {
                    showToast('Failed to copy', 'error');
                }
                document.body.removeChild(textarea);
            });
        }

        /**
         * Show a toast notification.
         */
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;

            const iconMap = {
                success: 'circle-check',
                error: 'circle-xmark',
                info: 'circle-info'
            };

            toast.innerHTML = 
                '<span class="ic">' + svg(iconMap[type] || iconMap.info) + '</span>' +
                '<span>' + escapeHtml(message) + '</span>';

            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toast-out 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /**
         * Reset the UI back to the upload state.
         */
        function resetToUpload() {
            cardSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');

            if (currentAvatarBlobUrl) {
                URL.revokeObjectURL(currentAvatarBlobUrl);
                currentAvatarBlobUrl = null;
            }
            currentCardData = null;
            currentRawData = null;
            cardContent.innerHTML = '';
        }

        /** TEMPCHECK
         * Generate a random alphanumeric ID matching format.
         * Produces strings like "mpv5bdv6lkbqevlz1z".
         */
        function generateEntryId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let id = '';
            for (let i = 0; i < 19; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        /**
         * Replace {{user}} and {{char}} placeholders with the lore format equivalents.
         */
        function replaceLorePlaceholders(text) {
            if (typeof text !== 'string') return text;
            // Replace {{user}} in any case variation with {{lore USER}}
            text = text.replace(/\{\{user\}\}/gi, '{{lore USER}}');
            // Replace {{char}} in any case variation with {{lore CHAR}}
            text = text.replace(/\{\{char\}\}/gi, '{{lore CHAR}}');
            return text;
        }

        /**
         * Convert character Card data into Vascura FRONT Lorebook JSON structure.
         *
         *  1. ReadMe             — initialization instruction
         *  2. USER               — placeholder for user name
         *  3. USER Description   — empty, for user to fill
         *  4. CHAR               — character name from card
         *  5. Description        — core info
         *  6. Scenario           — core info
         *  7. Personality        — overview item
         *  8. System Prompt      — system configuration
         *  9. Post-History Instructions — system configuration
         * 10. Depth Prompt       — system configuration
         * 11. Message Examples   — reference material
         * 12. First Message      — First Message (or {{pick}} if Alternate Greetings exist)
         * 13. Lorebook entries   — Lorebook
         *
         * Skips: Creator Notes, metadata/tags/creator info.
         */
        function convertToTargetFormat(card) {
            const entries = [];

            /**
             * Add a single entry to the entries array.
             * @param {string} title        — Section title
             * @param {string} content      — Text content
             * @param {object}  [options]   — Optional flags
             * @param {string}  [options.tags='']         — Comma-separated tags
             * @param {boolean} [options.alwaysActive=false] — Whether entry is pinned to system prompt
             * @param {boolean} [options.active=true]       — Whether entry is enabled
             */
            function addEntry(title, content, options) {
                options = options || {};
                const tags = options.tags || '';
                const alwaysActive = options.alwaysActive || false;
                const active = options.active !== undefined ? options.active : true;

                entries.push({
                    id: generateEntryId(),
                    title: title,
                    tags: tags,
                    depth: '10',
                    content: replaceLorePlaceholders(content || ''),
                    active: active,
                    alwaysActive: alwaysActive,
                    image: null
                });
            }

            // ── 1. ReadMe ── Always the first entry with initialization notice
            addEntry(
                'ReadMe',
                'Please use `Clean Chat Messages (Reset Chat)` Button to initialize the Card.'
            );

            // ── 2. USER ── Placeholder for the user's name in the lore format
            addEntry('USER', 'USER');

            // ── 3. USER Description ── Empty, user fills this in later
            addEntry('USER Description', '', { alwaysActive: true });

            // ── 4. CHAR ── Character name from the card
            addEntry('CHAR', card.name || '');

            // ── 5. Description ── Core character info
            if (card.description) {
                addEntry('Description', card.description, { alwaysActive: true });
            }

            // ── 6. Scenario ── Core scenario info
            if (card.scenario) {
                addEntry('Scenario', card.scenario, { alwaysActive: true });
            }

            // ── 7. Personality ── Overview item
            if (card.personality) {
                addEntry('Personality', card.personality, { alwaysActive: true });
            }

            // ── 8. System Prompt ── System configuration
            if (card.system_prompt) {
                addEntry('System Prompt', card.system_prompt, { alwaysActive: true });
            }

            // ── 9. Post-History Instructions ── System configuration
            if (card.post_history_instructions) {
                addEntry('Post-History Instructions', '{{anote ' + card.post_history_instructions + '}}', { alwaysActive: true });
            }

            // ── 10. Depth Prompt ── From extensions.depth_prompt
            if (card.extensions && card.extensions.depth_prompt && card.extensions.depth_prompt.prompt) {
                addEntry('Depth Prompt', card.extensions.depth_prompt.prompt, { alwaysActive: true });
            }

            // ── 11. Message Examples ── Reference material
            if (card.mes_example) {
                addEntry('Message Examples', 'Message Examples:\n\n' + card.mes_example, { alwaysActive: true });
            }

            // ── 12. First Message + Alternate Greetings ──
            if (card.first_mes) {
                // Check whether alternate greetings are present and non-empty
                const hasAltGreetings = card.alternate_greetings && card.alternate_greetings.length > 0;

                if (hasAltGreetings) {
                    // Build the {{pick ...|...|...}} macro string.
                    // The first option is always the original First Message text,
                    // Example output: {{pick First Message text|Alt Greeting 1 text|Alt Greeting 2 text}}
                    const pickParts = [card.first_mes];

                    card.alternate_greetings.forEach(function(greet) {
                        pickParts.push(greet);
                    });

                    // Join all parts with the pipe delimiter inside the {{pick}} macro
                    const combinedContent = '{{pick ' + pickParts.join('|') + '}}';

                    // Create a single "First Message" entry with the combined {{pick}} content
                    addEntry('First Message', combinedContent);
                } else {
                    // No alternate greetings — just the first message as-is
                    addEntry('First Message', card.first_mes);
                }
            } else if (card.alternate_greetings && card.alternate_greetings.length > 0) {
                // Edge case: no first_mes but alternate greetings do exist.
                // Create separate entries for each alternate greeting as a fallback.
                card.alternate_greetings.forEach(function(greet, i) {
                    addEntry('Alternate Greeting ' + (i + 1), greet);
                });
            }

            // ── 13. Lorebook entries ── alwaysActive follows the constant flag
            if (card.character_book && card.character_book.entries && card.character_book.entries.length > 0) {
                card.character_book.entries.forEach(function(entry, idx) {
                    // Use comment/name for title, fallback to "Entry <id>"
                    const entryName = entry.comment || entry.name || ('Entry ' + (entry.id != null ? entry.id : idx));
                    // Keys become comma-separated tags
                    const tags = (entry.keys || []).join(', ');
                    // alwaysActive maps to the Lorebook constant flag
                    const alwaysActive = !!entry.constant;
                    // active maps to the Lorebook enabled flag
                    const active = entry.enabled !== false;

                    addEntry(entryName, entry.content || '', {
                        tags: tags,
                        alwaysActive: alwaysActive,
                        active: active
                    });
                });
            }

            // Return the final structure
            return {
                entries: entries,
                disabled: false,
                enabled: true
            };
        }

        /**
         * Export the card data converted to the Vascura FRONT Lorebook JSON format.
         */
        function exportJSON() {
            if (!currentCardData) return;

            // Convert the normalized card data into the target format
            const targetData = convertToTargetFormat(currentCardData);

            // Generate a safe filename from the character name
            const name = (currentCardData && currentCardData.name) || 'character';
            const safeName = name.replace(/[^a-zA-Z0-9_-]/g, '_');

            // Serialize and download
            const json = JSON.stringify(targetData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = safeName + '.json';
            a.click();

            URL.revokeObjectURL(url);
            showToast('Converted JSON exported: ' + safeName + '.json', 'success');
        }

        /* =============================================
           EVENT LISTENERS & INITIALIZATION
           ============================================= */

        function initEventListeners() {
            // — File input change —
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                    e.target.value = '';
                }
            });

            // — Drop zone click —
            dropZone.addEventListener('click', () => fileInput.click());

            // — Drop zone keyboard —
            dropZone.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    fileInput.click();
                }
            });

            // — Drag and drop on drop zone —
            ['dragenter', 'dragover'].forEach(event => {
                dropZone.addEventListener(event, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropZone.classList.add('drag-over');
                });
            });

            ['dragleave', 'drop'].forEach(event => {
                dropZone.addEventListener(event, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropZone.classList.remove('drag-over');
                });
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            // — Global drag and drop (whole page) —
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer?.files;
                if (files && files.length > 0) {
                    handleFile(files[0]);
                }
            });

            // — Clipboard paste (Ctrl+V) — Read PNG image from clipboard —
            document.addEventListener('paste', (e) => {
                // Do NOT intercept paste when the user is typing in an input
                // or textarea — they may need normal text paste functionality
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                const clipboardData = e.clipboardData;
                if (!clipboardData) return;

                // Iterate through all clipboard items looking for image/png
                for (let i = 0; i < clipboardData.items.length; i++) {
                    const item = clipboardData.items[i];

                    // Found a PNG image — extract and process it
                    if (item.type === 'image/png' && item.kind === 'file') {
                        e.preventDefault();

                        // Get the blob from the clipboard item
                        const blob = item.getAsFile();
                        if (!blob) continue;

                        // Wrap in a proper File object with .png name so that
                        // handleFile() correctly routes it to handlePNG()
                        const file = new File([blob], 'clipboard_paste.png', { type: 'image/png' });

                        handleFile(file);
                        return; // Only process the first PNG found
                    }
                }
            });

            // — Action buttons —
            btnLoadAnother.addEventListener('click', resetToUpload);
            btnExport.addEventListener('click', exportJSON);

            // — Copy button: generates formatted plain text from all card entries
            btnCopyText.addEventListener('click', () => {
                if (currentCardData) {
                    const fullText = generateFullText(currentCardData);
                    copyToClipboard(fullText, btnCopyText);
                }
            });

            // — Convert button: opens the custom modal —
            btnConvert.addEventListener('click', openConvertModal);

            // — Convert modal: Cancel button —
            convertCancelBtn.addEventListener('click', closeConvertModal);

            // — Convert modal: Backdrop click —
            convertModalBackdrop.addEventListener('click', closeConvertModal);

            // — Convert modal: Confirm button —
            convertConfirmBtn.addEventListener('click', executeConvert);

            // — Convert modal: Enter key in inputs —
            convertCharInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    executeConvert();
                }
            });
            convertUserInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    executeConvert();
                }
            });

            // — Global keyboard shortcuts —
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && convertModal.classList.contains('active')) {
                    closeConvertModal();
                    return;
                }

                if (convertModal.classList.contains('active')) return;

                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'o' || e.key === 'O') {
                    e.preventDefault();
                    fileInput.click();
                }
                if (e.key === 'Escape' && !cardSection.classList.contains('hidden')) {
                    resetToUpload();
                }
            });
        }

        // Initialize the application
        initEventListeners();

    })();
    </script>
