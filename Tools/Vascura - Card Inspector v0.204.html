<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vascura - Card Inspector — Character Card Reader</title>

    <style>
        /* ================================================================
           CSS CUSTOM PROPERTIES (DESIGN TOKENS)
           ================================================================ */
        :root {
            --bg: #111111;               /* Base background — neutral near-black */
            --bg-elevated: #1A1A1A;      /* Elevated surfaces — dark gray */
            --card: #222222;             /* Card panels — medium dark gray */
            --card-hover: #2B2B2B;       /* Card hover state — lighter dark gray */
            --border: #333333;           /* Default borders — mid gray */
            --border-focus: #4A4A4A;     /* Focused borders — lighter gray */
            --fg: #F5F5F5;               /* Primary text — bright near-white (bumped up for contrast) */
            --fg-secondary: #D0D0D0;     /* Secondary text — bright light gray (bumped up for readability) */
            --muted: #A0A0A0;            /* Muted/deemphasized text — clear medium gray (bumped up significantly) */
            --accent: #D4A03C;           /* GOLD — unchanged */
            --accent-hover: #E8B44C;     /* GOLD — unchanged */
            --accent-dim: #7A5E1F;       /* GOLD — unchanged */
            --accent-glow: rgba(212, 160, 60, 0.15); /* GOLD — unchanged */
            --success: #4ADE80;          /* Semantic green — unchanged */
            --warning: #F59E0B;          /* Semantic amber — unchanged */
            --error: #EF4444;            /* Semantic red — unchanged */
            --info: #38BDF8;             /* Semantic blue — unchanged */
            --tag-bg: rgba(212, 160, 60, 0.1);     /* GOLD tag tint — unchanged */
            --tag-border: rgba(212, 160, 60, 0.25); /* GOLD tag border — unchanged */
            --code-bg: #0D0D0D;          /* Code blocks — neutral near-black */
        }

        /* ================================================================
           GLOBAL RESET & BASE STYLES
           ================================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
            background-color: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            /* Subtle dot grid background — dots changed from purple-tint to neutral gray */
            background-image: radial-gradient(circle, rgba(51, 51, 51, 0.5) 1px, transparent 1px);
            background-size: 28px 28px;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-elevated); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

        /* ================================================================
           SVG ICON BASE STYLES
           ================================================================ */
        .svg-icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ic { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ic-w4 { width: 1rem; }
        .ic-w3 { width: 0.75rem; }

        /* ================================================================
           UTILITY CLASSES — Replacing Tailwind CSS
           ================================================================ */

        /* --- Display --- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .inline-flex { display: inline-flex; }
        .inline { display: inline; }
        .inline-block { display: inline-block; }
        .block { display: block; }

        /* --- Flexbox --- */
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1 1 0%; }
        .flex-shrink-0 { flex-shrink: 0; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }

        /* --- Gap --- */
        .gap-1 { gap: 0.25rem; }
        .gap-1\.5 { gap: 0.375rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-5 { gap: 1.25rem; }
        .gap-6 { gap: 1.5rem; }

        /* --- Padding --- */
        .p-12 { padding: 3rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
        .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .pr-4 { padding-right: 1rem; }
        .pb-4 { padding-bottom: 1rem; }

        /* --- Margin --- */
        .mx-auto { margin-left: auto; margin-right: auto; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-5 { margin-bottom: 1.25rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-1\.5 { margin-top: 0.375rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-5 { margin-top: 1.25rem; }

        /* --- Sizing --- */
        .w-3 { width: 0.75rem; }
        .w-4 { width: 1rem; }
        .w-8 { width: 2rem; }
        .w-16 { width: 4rem; }
        .w-20 { width: 5rem; }
        .w-full { width: 100%; }
        .h-8 { height: 2rem; }
        .h-16 { height: 4rem; }
        .h-20 { height: 5rem; }
        .min-w-0 { min-width: 0; }
        .max-w-xs { max-width: 20rem; }
        .max-w-xl { max-width: 36rem; }
        .max-w-5xl { max-width: 64rem; }
        .min-h-60vh { min-height: 60vh; }

        /* --- Position --- */
        .fixed { position: fixed; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .top-5 { top: 1.25rem; }
        .right-5 { right: 1.25rem; }
        .inset-0 { inset: 0; }
        .z-50 { z-index: 50; }
        .left-3 { left: 0.75rem; }
        .top-1\/2 { top: 50%; }

        /* --- Transform --- */
        .-translate-y-1\/2 { transform: translateY(-50%); }

        /* --- Typography --- */
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }

        /* Arbitrary text sizes */
        .text-0\.6rem { font-size: 0.6rem; }
        .text-0\.65rem { font-size: 0.65rem; }
        .text-0\.7rem { font-size: 0.7rem; }
        .text-0\.72rem { font-size: 0.72rem; }
        .text-0\.75rem { font-size: 0.75rem; }
        .text-0\.78rem { font-size: 0.78rem; }
        .text-0\.8rem { font-size: 0.8rem; }
        .text-0\.82rem { font-size: 0.82rem; }
        .text-0\.85rem { font-size: 0.85rem; }
        .text-0\.9rem { font-size: 0.9rem; }

        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
        .font-display { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
        .font-body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }

        .tracking-tight { letter-spacing: -0.025em; }
        .tracking-wider { letter-spacing: 0.05em; }
        .text-center { text-align: center; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .whitespace-nowrap { white-space: nowrap; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }

        /* --- Colors (CSS variable based) --- */
        .text-fg { color: var(--fg); }
        .text-fg-sec { color: var(--fg-secondary); }
        .text-muted { color: var(--muted); }
        .text-accent { color: var(--accent); }
        .text-bg { color: var(--bg); }
        .bg-accent { background-color: var(--accent); }
        .bg-accent-glow { background-color: var(--accent-glow); }
        .bg-bg { background-color: var(--bg); }
        .bg-bg-elevated { background-color: var(--bg-elevated); }
        .bg-card { background-color: var(--card); }
        .bg-card-hover { background-color: var(--card-hover); }

        /* --- Borders --- */
        .border { border: 1px solid var(--border); }
        .border-b { border-bottom: 1px solid var(--border); }
        .border-t { border-top: 1px solid var(--border); }
        .border-2 { border: 2px solid var(--border); }
        .border-accent { border-color: var(--accent); }
        .border-accent-dim { border-color: var(--accent-dim); }

        /* --- Border radius --- */
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }

        /* --- Overflow --- */
        .overflow-x-auto { overflow-x: auto; }
        .overflow-hidden { overflow: hidden; }

        /* --- Object fit --- */
        .object-cover { object-fit: cover; }

        /* --- Pointer events --- */
        .pointer-events-none { pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }

        /* ================================================================
           RESPONSIVE — sm: (min-width: 640px) variants
           ================================================================ */
        @media (min-width: 640px) {
            .sm-flex-row { flex-direction: row; }
            .sm-items-center { align-items: center; }
            .sm-text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
            .sm-inline-flex { display: inline-flex; }
            .sm-inline { display: inline; }
        }

        /* ================================================================
           ANIMATED UPLOAD DROP ZONE
           ================================================================ */
        .drop-zone {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .drop-zone:hover::after,
        .drop-zone.drag-over::after {
            opacity: 1;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .drop-zone.drag-over {
            transform: scale(1.01);
        }

        @keyframes scan-line {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* Pulse animation for the upload icon */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .upload-icon {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        /* ================================================================
           SECTION CARD STYLES
           ================================================================ */
        .section-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .section-card:hover {
            border-color: var(--border-focus);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .section-header:hover {
            background: var(--card-hover);
        }

        .section-body {
            padding: 0 18px 0px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
        }

        .section-card.open .section-body {
            max-height: 5000px;
            padding: 0 18px 0px;
        }

        .section-chevron {
            transition: transform 0.3s ease;
            color: var(--muted);
        }

        .section-card.open .section-chevron {
            transform: rotate(180deg);
        }

        /* ================================================================
           SCROLLABLE SECTION CONTENT
           ================================================================ */
        .scrollable-section-content {
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 6px;
            padding-bottom: 8px;
            scroll-behavior: smooth;
        }

        .scrollable-section-content::-webkit-scrollbar { width: 7px; }
        .scrollable-section-content::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }
        .scrollable-section-content::-webkit-scrollbar-thumb {
            background: var(--border-focus);
            border-radius: 4px;
        }
        .scrollable-section-content::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dim);
        }

        /* ================================================================
           RENDERED MARKDOWN CONTENT
           ================================================================ */
        .md-content {
            color: var(--fg-secondary);
            line-height: 1.75;
            font-size: 0.9rem;
        }

        .md-content p { margin-bottom: 0.75em; }
        .md-content p:last-child { margin-bottom: 0; }

        .md-content strong {
            color: var(--fg);
            font-weight: 600;
        }

        .md-content em { color: var(--accent); font-style: italic; }
        .md-content h1, .md-content h2, .md-content h3,
        .md-content h4, .md-content h5, .md-content h6 {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
            color: var(--fg);
            margin: 1em 0 0.5em;
        }

        .md-content h1 { font-size: 1.4em; }
        .md-content h2 { font-size: 1.25em; }
        .md-content h3 { font-size: 1.1em; }

        .md-content ul, .md-content ol {
            padding-left: 1.5em;
            margin-bottom: 0.75em;
        }

        .md-content li { margin-bottom: 0.3em; }

        .md-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--accent);
        }

        .md-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            overflow-x: auto;
            margin-bottom: 0.75em;
        }

        .md-content pre code {
            background: none;
            padding: 0;
            color: var(--fg-secondary);
        }

        .md-content blockquote {
            border-left: 3px solid var(--accent-dim);
            padding-left: 14px;
            margin: 0.75em 0;
            color: var(--muted);
        }

        .md-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1em 0;
        }

        .md-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .md-content img {
            max-width: 100%;
        }

        .md-content del {
            color: var(--muted);
            text-decoration: line-through;
        }

        /* ================================================================
           PLAIN TEXT CONTENT (legacy — kept for backwards compatibility)
           ================================================================ */
        .plain-text-content {
            color: var(--fg-secondary);
            line-height: 1.75;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
        }

        /* ================================================================
           TAG / BADGE STYLES
           ================================================================ */
        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--tag-border);
            background: var(--tag-bg);
            color: var(--accent);
            white-space: nowrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-spec {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38BDF8;
        }

        .badge-constant {
            background: rgba(212, 160, 60, 0.12);
            border: 1px solid rgba(212, 160, 60, 0.25);
            color: var(--accent);
        }

        .badge-selective {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: #A855F7;
        }

        .badge-enabled {
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.25);
            color: var(--success);
        }

        .badge-disabled {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--error);
        }

        /* ================================================================
           LOREBOOK ENTRY STYLES
           ================================================================ */
        .lore-entry {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .lore-entry:hover {
            border-color: var(--border-focus);
        }

        .lore-entry-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            gap: 10px;
            transition: background 0.2s ease;
        }

        .lore-entry-header:hover {
            background: var(--card-hover);
        }

        .lore-entry-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }

        .lore-entry.open .lore-entry-body {
            max-height: 5000px;
        }

        .key-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--fg-secondary);
        }

        /* ================================================================
           LOREBOOK ENTRIES SCROLLABLE CONTAINER
           ================================================================ */
        .lore-entries-scroll {
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* ================================================================
           TOAST NOTIFICATION
           ================================================================ */
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: toast-in 0.3s ease;
            pointer-events: auto;
            max-width: 360px;
        }

        .toast-success {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--success);
        }

        .toast-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .toast-info {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--info);
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toast-out {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(30px); }
        }

        /* ================================================================
           COPY BUTTON
           ================================================================ */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            color: var(--accent);
            border-color: var(--accent-dim);
            background: var(--accent-glow);
        }

        .copy-btn.copied {
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        /* ================================================================
           ACTION BUTTON
           ================================================================ */
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--fg-secondary);
        }

        .action-btn:hover {
            border-color: var(--accent-dim);
            color: var(--accent);
            background: var(--accent-glow);
        }

        .action-btn-primary {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .action-btn-primary:hover {
            background: var(--accent-hover);
            color: var(--bg);
        }

        /* ================================================================
           STAT ITEM
           ================================================================ */
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 10px 18px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .stat-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--fg);
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ================================================================
           CREATOR NOTES IFRAME
           ================================================================ */
        .creator-notes-frame {
            width: 100%;
            min-height: 200px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
        }

        /* ================================================================
           FADE TRANSITIONS
           ================================================================ */
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Staggered children animation */
        .stagger-children > * {
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
        .stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
        .stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
        .stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
        .stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
        .stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
        .stagger-children > *:nth-child(7) { animation-delay: 0.35s; }
        .stagger-children > *:nth-child(8) { animation-delay: 0.4s; }
        .stagger-children > *:nth-child(9) { animation-delay: 0.45s; }
        .stagger-children > *:nth-child(10) { animation-delay: 0.5s; }

        /* ================================================================
           SEARCH INPUT
           ================================================================ */
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
            transition: border-color 0.2s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        /* ================================================================
           SETTINGS GRID IN LOREBOOK ENTRIES
           ================================================================ */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 6px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .setting-item span:first-child {
            color: var(--fg-secondary);
            font-weight: 500;
        }

        /* ================================================================
           CONVERT MODAL STYLES
           ================================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            max-width: 440px;
            width: calc(100% - 32px);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            transform: scale(0.92) translateY(12px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            font-size: 0.9rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
            transition: border-color 0.2s ease;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .modal-input::placeholder {
            color: var(--muted);
        }

        .modal-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--fg-secondary);
            margin-bottom: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                         'Liberation Mono', 'Courier New', monospace;
        }

        .modal-label-badge {

                    let codeBlock = '';
                    i++;
                    while (i < lines.length && !lines[i].trimStart().startsWith('```')) {
                        codeBlock += (codeBlock ? '\n' : '') + lines[i];
                        i++;
                    }
                    i++; // skip closing ```
                    html += '<pre><code>' + codeBlock + '</code></pre>';
                    continue;
                }

                // --- Headings ---
                const headingMatch = line.match(/^(#{1,6})\s+(.*)/);
                if (headingMatch) {
                    const level = headingMatch[1].length;
                    html += '<h' + level + '>' + applyInline(headingMatch[2]) + '</h' + level + '>';
                    i++;
                    continue;
                }

                // --- Horizontal Rule ---
                if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line.trim())) {
                    html += '<hr>';
                    i++;
                    continue;
                }

                // --- Blockquote ---
                if (line.trimStart().startsWith('&gt;')) {
                    let quoteContent = '';
                    while (i < lines.length && lines[i].trimStart().startsWith('&gt;')) {
                        quoteContent += (quoteContent ? '\n' : '') + lines[i].replace(/^(\s*)&gt;\s?/, '');
                        i++;
                    }
                    html += '<blockquote>' + parseMarkdown(quoteContent) + '</blockquote>';
                    continue;
                }

                // --- Unordered List ---
                if (/^(\s*)[-*+]\s/.test(line)) {
                    html += '<ul>';
                    while (i < lines.length && /^(\s*)[-*+]\s(.*)/.test(lines[i])) {
                        const itemMatch = lines[i].match(/^(\s*)[-*+]\s(.*)/);
                        html += '<li>' + applyInline(itemMatch[2]) + '</li>';
                        i++;
                    }
                    html += '</ul>';
                    continue;
                }

                // --- Ordered List ---
                if (/^(\s*)\d+\.\s/.test(line)) {
                    html += '<ol>';
                    while (i < lines.length && /^(\s*)\d+\.\s(.*)/.test(lines[i])) {
                        const itemMatch = lines[i].match(/^(\s*)\d+\.\s(.*)/);
                        html += '<li>' + applyInline(itemMatch[2]) + '</li>';
                        i++;
                    }
                    html += '</ol>';
                    continue;
                }

                // --- Empty line ---
                if (line.trim() === '') {
                    i++;
                    continue;
                }

                // --- Paragraph ---
                let para = applyInline(line);
                i++;
                // GFM line break: two spaces at end = <br>
                if (line.endsWith('  ')) {
                    para += '<br>';
                }
                // Merge consecutive non-empty, non-special lines into one Paragraph
                while (i < lines.length && lines[i].trim() !== '' && !lines[i].trimStart().startsWith('```') && !lines[i].match(/^(#{1,6})\s/) && !/^(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i].trim()) && !lines[i].trimStart().startsWith('&gt;') && !/^(\s*)[-*+]\s/.test(lines[i]) && !/^(\s*)\d+\.\s/.test(lines[i])) {
                    para += '<br>' + applyInline(lines[i]);
                    i++;
                }
                html += '<p>' + para + '</p>';
            }

            return html;
        }

        /**
         * Apply inline markdown rules: bold, italic, strikethrough, code, links, images.
         */
        function applyInline(text) {
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Images
            text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%;">');
            // Links
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            // Bold + Italic
            text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            text = text.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
            // Bold
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
            // Italic
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            text = text.replace(/_(.+?)_/g, '<em>$1</em>');
            // Strikethrough
            text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
            return text;
        }

        /* =============================================
           PNG PARSING — EXTRACT CHARACTER DATA
           ============================================= */

        /**
         * Extract character data from a PNG file's tEXt metadata chunks.
         */
        function extractCharaFromPNG(buffer) {
            const view = new DataView(buffer);
            const bytes = new Uint8Array(buffer);

            // Validate PNG signature
            const pngSignature = [137, 80, 78, 71, 13, 10, 26, 10];
            for (let i = 0; i < 8; i++) {
                if (bytes[i] !== pngSignature[i]) {
                    throw new Error('Not a valid PNG file');
                }
            }

            // Walk through chunks
            let offset = 8;
            while (offset < bytes.length) {
                if (offset + 8 > bytes.length) break;

                const chunkLength = view.getUint32(offset);
                const chunkType = String.fromCharCode(
                    bytes[offset + 4], bytes[offset + 5],
                    bytes[offset + 6], bytes[offset + 7]
                );

                // Look for tEXt chunks
                if (chunkType === 'tEXt') {
                    let keywordEnd = offset + 8;
                    while (keywordEnd < offset + 8 + chunkLength && bytes[keywordEnd] !== 0) {
                        keywordEnd++;
                    }

                    const keyword = new TextDecoder('latin1').decode(
                        bytes.slice(offset + 8, keywordEnd)
                    );

                    if (keyword === 'chara') {
                        const textData = bytes.slice(keywordEnd + 1, offset + 8 + chunkLength);
                        const base64String = new TextDecoder('latin1').decode(textData);
                        const jsonString = base64ToUtf8(base64String);
                        return JSON.parse(jsonString);
                    }
                }

                // Also check iTXt chunks
                if (chunkType === 'iTXt') {
                    const result = parseITXtChunk(bytes, offset, chunkLength);
                    if (result) return result;
                }

                offset += 12 + chunkLength;
            }

            throw new Error('No character data (tEXt "chara" chunk) found in this PNG');
        }

        /**
         * Parse an iTXt chunk looking for "chara" keyword.
         */
        function parseITXtChunk(bytes, offset, chunkLength) {
            let pos = offset + 8;
            let keywordEnd = pos;
            while (keywordEnd < offset + 8 + chunkLength && bytes[keywordEnd] !== 0) {
                keywordEnd++;
            }
            const keyword = new TextDecoder('utf-8').decode(bytes.slice(pos, keywordEnd));

            if (keyword !== 'chara') return null;

            pos = keywordEnd + 1;
            const compressionFlag = bytes[pos];
            const compressionMethod = bytes[pos + 1];
            pos += 2;

            while (pos < offset + 8 + chunkLength && bytes[pos] !== 0) pos++;
            pos++;
            while (pos < offset + 8 + chunkLength && bytes[pos] !== 0) pos++;
            pos++;

            const textData = bytes.slice(pos, offset + 8 + chunkLength);
            const base64String = new TextDecoder('utf-8').decode(textData);

            try {
                const jsonString = base64ToUtf8(base64String);
                return JSON.parse(jsonString);
            } catch (e) {
                return null;
            }
        }

        /**
         * Decode a base64 string to UTF-8 text.
         */
        function base64ToUtf8(base64) {
            const cleaned = base64.replace(/[\s\r\n]/g, '');
            const binaryString = atob(cleaned);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        /* =============================================
           CARD NORMALIZATION
           ============================================= */

        /**
         * Normalize V1 and V2 card formats into a common structure.
         */
        function normalizeCard(raw) {
            if (!raw || typeof raw !== 'object') {
                throw new Error('Invalid card data: not a JSON object');
            }

            // V2 spec detection
            if (raw.spec === 'chara_card_v2' && raw.data) {
                const data = { ...raw.data };
                data._spec = 'V2';
                data._specVersion = raw.spec_version || '2.0';
                return data;
            }

            // V1 spec (flat structure)
            const data = { ...raw };
            data._spec = 'V1';
            data._specVersion = '1.0';
            return data;
        }

        /* =============================================
           FILE HANDLING
           ============================================= */

        /**
         * Handle a file selected or dropped by the user.
         */
        async function handleFile(file) {
            if (!file) return;

            const isPNG = file.type === 'image/png' || file.name.toLowerCase().endsWith('.png');
            const isJSON = file.type === 'application/json' || file.name.toLowerCase().endsWith('.json');

            if (!isPNG && !isJSON) {
                showToast('Unsupported file type. Please use PNG or JSON files.', 'error');
                return;
            }

            try {
                if (isPNG) {
                    await handlePNG(file);
                } else {
                    await handleJSON(file);
                }
            } catch (error) {
                console.error('File parsing error:', error);
                showToast('Failed to parse file: ' + error.message, 'error');
            }
        }

        /**
         * Parse a PNG file.
         */
        async function handlePNG(file) {
            const buffer = await file.arrayBuffer();

            let rawData;
            try {
                rawData = extractCharaFromPNG(buffer);
            } catch (e) {
                try {
                    const text = await file.text();
                    rawData = JSON.parse(text);
                } catch (e2) {
                    throw new Error('No character data found in this PNG file. Make sure it\'s a character card PNG.');
                }
            }

            if (currentAvatarBlobUrl) {
                URL.revokeObjectURL(currentAvatarBlobUrl);
            }
            currentAvatarBlobUrl = URL.createObjectURL(file);

            processCardData(rawData, currentAvatarBlobUrl);
        }

        /**
         * Parse a JSON file directly.
         */
        async function handleJSON(file) {
            const text = await file.text();
            let rawData;

            try {
                rawData = JSON.parse(text);
            } catch (e) {
                throw new Error('Invalid JSON file: ' + e.message);
            }

            processCardData(rawData, null);
        }

        /**
         * Process and display normalized card data.
         */
        function processCardData(rawData, avatarBlobUrl) {
            const card = normalizeCard(rawData);

            currentCardData = card;
            currentRawData = rawData;

            const avatarUrl = avatarBlobUrl
                || (card.avatar && card.avatar.startsWith('http') ? card.avatar : null);

            renderCard(card, avatarUrl);
            showToast('Character card loaded successfully', 'success');
        }

        /* =============================================
           CONVERT / PLACEHOLDER REPLACEMENT LOGIC
           ============================================= */

        /**
         * Recursively replace {{char}} and {{user}} placeholders.
         */
        function replacePlaceholdersInObject(obj, charName, userName) {
            if (typeof obj === 'string') {
                let result = obj;
                if (charName) {
                    result = result.replace(/\{\{char\}\}/gi, function(match) {
                        replacementCount++;
                        return charName;
                    });
                }
                if (userName) {
                    result = result.replace(/\{\{user\}\}/gi, function(match) {
                        replacementCount++;
                        return userName;
                    });
                }
                return result;
            }

            if (Array.isArray(obj)) {
                return obj.map(function(item) {
                    return replacePlaceholdersInObject(item, charName, userName);
                });
            }

            if (obj && typeof obj === 'object') {
                const result = {};
                for (const key of Object.keys(obj)) {
                    if (key === '_spec' || key === '_specVersion') {
                        result[key] = obj[key];
                    } else {
                        result[key] = replacePlaceholdersInObject(obj[key], charName, userName);
                    }
                }
                return result;
            }

            return obj;
        }

        /**
         * Open the Convert modal.
         */
        function openConvertModal() {
            if (!currentCardData) return;
            convertCharInput.value = currentCardData.name || '';
            convertUserInput.value = '';
            convertModal.classList.add('active');
            setTimeout(function() {
                convertCharInput.focus();
                convertCharInput.select();
            }, 100);
        }

        /**
         * Close the Convert modal.
         */
        function closeConvertModal() {
            convertModal.classList.remove('active');
        }

        /**
         * Execute the placeholder conversion.
         */
        function executeConvert() {
            const charName = convertCharInput.value.trim();
            const userName = convertUserInput.value.trim();

            if (!charName && !userName) {
                showToast('Please enter at least one replacement name', 'error');
                return;
            }

            replacementCount = 0;

            currentCardData = replacePlaceholdersInObject(currentCardData, charName, userName);

            if (currentRawData.spec === 'chara_card_v2' && currentRawData.data) {
                currentRawData.data = replacePlaceholdersInObject(currentRawData.data, charName, userName);
            } else {
                currentRawData = replacePlaceholdersInObject(currentRawData, charName, userName);
            }

            closeConvertModal();

            const avatarUrl = currentAvatarBlobUrl
                || (currentCardData.avatar && currentCardData.avatar.startsWith('http') ? currentCardData.avatar : null);
            renderCard(currentCardData, avatarUrl);

            if (replacementCount > 0) {
                showToast('Replaced ' + replacementCount + ' placeholder' + (replacementCount !== 1 ? 's' : ''), 'success');
            } else {
                showToast('No placeholders found to replace', 'info');
            }
        }

        /* =============================================
           GENERATE FORMATTED PLAIN TEXT
           ============================================= */

        /**
         * Build a formatted plain-text string from the card data.
         */
        function generateFullText(card) {
            const lines = [];

            if (card.name) {
                lines.push('# Card Name: ' + card.name);
                lines.push('');
            }

            if (card.description) {
                lines.push('# Description:');
                lines.push(card.description);
                lines.push('');
            }

            if (card.personality) {
                lines.push('# Personality:');
                lines.push(card.personality);
                lines.push('');
            }

            if (card.scenario) {
                lines.push('# Scenario:');
                lines.push(card.scenario);
                lines.push('');
            }

            const hasMessages = card.first_mes
                || (card.alternate_greetings && card.alternate_greetings.length > 0)
                || card.mes_example;

            if (hasMessages) {
                lines.push('# Messages:');

                if (card.first_mes) {
                    lines.push('');
                    lines.push('## First Message:');
                    lines.push(card.first_mes);
                    lines.push('');
                }

                if (card.alternate_greetings && card.alternate_greetings.length > 0) {
                    card.alternate_greetings.forEach(function(greet, i) {
                        lines.push('## Alternate Greeting ' + (i + 1) + ':');
                        lines.push(greet);
                        lines.push('');
                    });
                }

                if (card.mes_example) {
                    lines.push('## Message Examples:');
                    lines.push(card.mes_example);
                    lines.push('');
                }
            }

            if (card.character_book && card.character_book.entries && card.character_book.entries.length > 0) {
                lines.push('# Lorebook:');
                lines.push('');

                card.character_book.entries.forEach(function(entry, idx) {
                    const entryName = entry.comment || entry.name || ('Entry ' + (entry.id != null ? entry.id : idx));
                    lines.push('## ' + entryName + ':');
                    lines.push(entry.content || '');
                    lines.push('');
                });
            }

            const hasSystemConfig = card.system_prompt
                || card.post_history_instructions
                || (card.extensions && card.extensions.depth_prompt && card.extensions.depth_prompt.prompt);

            if (hasSystemConfig) {
                lines.push('# System Configuration:');

                if (card.system_prompt) {
                    lines.push('');
                    lines.push('## System Prompt:');
                    lines.push(card.system_prompt);
                    lines.push('');
                }

                if (card.post_history_instructions) {
                    lines.push('## Post-History Instructions:');
                    lines.push(card.post_history_instructions);
                    lines.push('');
                }

                if (card.extensions && card.extensions.depth_prompt && card.extensions.depth_prompt.prompt) {
                    const dp = card.extensions.depth_prompt;
                    lines.push('## Depth Prompt (depth: ' + (dp.depth || 4) + ', role: ' + (dp.role || 'system') + '):');
                    lines.push(dp.prompt);
                    lines.push('');
                }
            }

            return lines.join('\n').trim();
        }

        /* =============================================
           UI RENDERING — MAIN CARD
           ============================================= */

        /**
         * Render the complete character card display.
         */
        function renderCard(card, avatarUrl) {
            // Switch views
            uploadSection.classList.add('hidden');
            cardSection.classList.remove('hidden');

            // Avatar
            if (avatarUrl) {
                cardAvatar.src = avatarUrl;
                cardAvatar.classList.remove('hidden');
            } else {
                cardAvatar.src = '';
                cardAvatar.classList.add('hidden');
            }

            // Name
            cardName.textContent = card.name || 'Unnamed Character';

            // Meta badges
            cardMeta.innerHTML = '';
            if (card._spec) {
                cardMeta.appendChild(createBadge(card._spec + ' ' + card._specVersion, 'badge-spec'));
            }
            if (card.creator) {
                cardMeta.appendChild(createMetaItem('user', 'by ' + card.creator));
            }
            if (card.character_version) {
                cardMeta.appendChild(createMetaItem('code-branch', 'v' + card.character_version));
            }

            // Tags
            renderTags(card.tags);

            // Stats
            renderStats(card);

            // Content sections
            renderContentSections(card);
        }

        /* =============================================
           UI RENDERING — TAGS
           ============================================= */

        function renderTags(tags) {
            cardTags.innerHTML = '';
            if (!tags || !tags.length) return;

            tags.forEach(tag => {
                const pill = document.createElement('span');
                pill.className = 'tag-pill';
                pill.textContent = tag;
                cardTags.appendChild(pill);
            });
        }

        /* =============================================
           UI RENDERING — STATS
           ============================================= */

        function renderStats(card) {
            cardStats.innerHTML = '';

            const allText = [
                card.description, card.personality, card.scenario,
                card.first_mes, card.mes_example,
                card.system_prompt, card.post_history_instructions
            ].filter(Boolean).join(' ');

            const wordCount = countWords(allText);

            const lorebookCount = (card.character_book && card.character_book.entries)
                ? card.character_book.entries.length : 0;

            const altGreetCount = (card.alternate_greetings && card.alternate_greetings.length) || 0;

            const stats = [
                { value: wordCount.toLocaleString(), label: 'Words' },
                { value: '~' + estimateTokens(allText).toLocaleString(), label: 'Tokens' },
                { value: lorebookCount, label: 'Lorebook' },
                { value: altGreetCount, label: 'Alt Greetings' },
            ];

            stats.forEach(stat => {
                const div = document.createElement('div');
                div.className = 'stat-item';
                div.innerHTML = '<span class="stat-value">' + stat.value + '</span><span class="stat-label">' + stat.label + '</span>';
                cardStats.appendChild(div);
            });
        }

        /* =============================================
           UI RENDERING — CONTENT SECTIONS
           ============================================= */

        function renderContentSections(card) {
            cardContent.innerHTML = '';

            // CREATOR NOTES
            if (card.creator_notes) {
                cardContent.appendChild(
                    createCreatorNotesSection(card.creator_notes)
                );
            }

            // OVERVIEW SECTION
            const overviewItems = [];
            if (card.description) {
                overviewItems.push({ title: 'Description', content: card.description, icon: 'file-lines' });
            }
            if (card.personality) {
                overviewItems.push({ title: 'Personality', content: card.personality, icon: 'brain' });
            }
            if (card.scenario) {
                overviewItems.push({ title: 'Scenario', content: card.scenario, icon: 'map' });
            }

            if (overviewItems.length) {
                if (overviewItems.length === 1) {
                    const item = overviewItems[0];
                    cardContent.appendChild(
                        createSection(item.title, item.content, { icon: item.icon, defaultOpen: false, scrollable: true })
                    );
                } else {
                    cardContent.appendChild(
                        createGroupSection('Overview', 'layer-group', overviewItems, false, true)
                    );
                }
            }

            // MESSAGES SECTION
            const messageItems = [];
            if (card.first_mes) {
                messageItems.push({ title: 'First Message', content: card.first_mes, icon: 'comment' });
            }
            if (card.alternate_greetings && card.alternate_greetings.length > 0) {
                card.alternate_greetings.forEach((greet, i) => {
                    messageItems.push({
                        title: 'Alternate Greeting ' + (i + 1),
                        content: greet,
                        icon: 'comments'
                    });
                });
            }
            if (card.mes_example) {
                messageItems.push({ title: 'Message Examples', content: card.mes_example, icon: 'message' });
            }

            if (messageItems.length) {
                cardContent.appendChild(
                    createGroupSection('Messages', 'envelope', messageItems, false, true)
                );
            }

            // SYSTEM CONFIGURATION SECTION
            const systemItems = [];
            if (card.system_prompt) {
                systemItems.push({ title: 'System Prompt', content: card.system_prompt, icon: 'terminal' });
            }
            if (card.post_history_instructions) {
                systemItems.push({ title: 'Post-History Instructions', content: card.post_history_instructions, icon: 'clock-rotate-left' });
            }
            const depthPrompt = card.extensions?.depth_prompt;
            if (depthPrompt && depthPrompt.prompt) {
                systemItems.push({
                    title: 'Depth Prompt (depth: ' + (depthPrompt.depth || 4) + ', role: ' + (depthPrompt.role || 'system') + ')',
                    content: depthPrompt.prompt,
                    icon: 'layer-group'
                });
            }

            if (systemItems.length) {
                cardContent.appendChild(
                    createGroupSection('System Configuration', 'gear', systemItems, false, false)
                );
            }

            // LOREBOOK SECTION
            if (card.character_book && card.character_book.entries && card.character_book.entries.length > 0) {
                cardContent.appendChild(createLorebookSection(card.character_book));
            }

            // METADATA SECTION
            cardContent.appendChild(createMetadataSection(card));
        }

        /* =============================================
           UI RENDERING — SECTION BUILDERS

        /**
         * Create a single collapsible section with markdown content.
         */
        function createSection(title, content, options = {}) {
            const { icon = 'file-lines', defaultOpen = false, wordCount = true, scrollable = false } = options;

            const section = document.createElement('div');
            section.className = 'section-card' + (defaultOpen ? ' open' : '');

            const wc = wordCount ? countWords(content) : 0;
            const tc = wordCount ? estimateTokens(content) : 0;

            const contentHtml = scrollable
                ? '<div class="scrollable-section-content"><div class="md-content">' + parseMarkdown(content) + '</div></div>'
                : '<div class="md-content">' + parseMarkdown(content) + '</div>';

            section.innerHTML = 
                '<div class="section-header" role="button" tabindex="0" aria-expanded="' + defaultOpen + '">' +
                    '<div class="flex items-center gap-3">' +
                        '<span class="ic ic-w4 text-accent">' + svg(icon) + '</span>' +
                        '<span class="font-display font-semibold text-sm text-fg">' + escapeHtml(title) + '</span>' +
                        (wc > 0 ? '<span class="text-0.65rem text-muted">' + wc.toLocaleString() + ' words · ~' + tc.toLocaleString() + ' tokens</span>' : '') +
                    '</div>' +
                    '<div class="flex items-center gap-2">' +
                        '<button class="copy-btn" title="Copy Content"><span class="ic ic-w3">' + svg('copy') + '</span></button>' +

        /**

        function createGroupSection(title, icon, items, defaultOpen = false, scrollable = false) {
            const section = document.createElement('div');
            section.className = 'section-card' + (defaultOpen ? ' open' : '');

            const totalWords = items.reduce((sum, item) => sum + countWords(item.content), 0);

            const innerContainer = scrollable
                ? '<div class="scrollable-section-content"><div class="flex flex-col gap-3" id="group-inner"></div></div>'
                : '<div class="flex flex-col gap-3" id="group-inner"></div>';

                        '<span class="font-display font-semibold text-sm text-fg">' + escapeHtml(title) + '</span>' +
                        '<span class="text-0.65rem text-muted">' + items.length + ' items · ' + totalWords.toLocaleString() + ' words</span>' +
                    '</div>' +
                    '<span class="section-chevron text-xs">' + svg('chevron-down') + '</span>' +
                '</div>' +
                '<div class="section-body">' + innerContainer + '</div>';

            const container = section.querySelector('#group-inner');
            // Remove the id to avoid duplicates
            container.removeAttribute('id');

            items.forEach(item => {
                container.appendChild(createSubSection(item.title, item.content, item.icon));
            });

            const header = section.querySelector('.section-header');
            header.addEventListener('click', () => {
                section.classList.toggle('open');
                header.setAttribute('aria-expanded', section.classList.contains('open'));
            });
            header.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    section.classList.toggle('open');
                }
            });

            return section;
        }

                    '<div class="px-4 pb-4">' +
                        '<div class="mb-3">' +

                        '<div class="mb-3">' +

                                '<span class="text-0.65rem text-muted uppercase tracking-wider font-semibold">Secondary Keys</span>' +
                                '<button class="copy-btn copy-sec-keys-btn" title="Copy Secondary Keys as Comma-Separated List"><span class="ic ic-w3">' + svg('copy') + '</span></button>' +

                            '<div class="setting-item"><span>Case Sensitive:</span> ' + (entry.case_sensitive ? 'Yes' : 'No') + '</div>' +

           UI HELPERS — BADGES & META ITEMS
